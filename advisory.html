<!DOCTYPE html>
<html lang="en">
<head>
    <title>Irrigation Advisory</title>

    <style>
        /* Task 4: Advisory Card Styling */

        .advisory-card {
            border: 2px solid #4CAF50;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            width: 450px;
            margin: 30px auto;
        }

        .advisory-card p {
            padding: 8px;
            margin: 8px 0;
        }

        .advisory-card p:hover {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .advisory-card h2 {
            text-align: center;
            color: #2e7d32;
        }
    </style>
</head>

<body>

    <h1 style="text-align: center;">Today's Irrigation Advisory</h1>

    <div class="advisory-card">

        <h2>Irrigation Advisory</h2>

        <p>
            <strong>Plot ID:</strong> PLOT-201
        </p>

        <p>
            <strong>Farmer Name:</strong> Janmesh Patil
        </p>

        <p>
            <strong>Soil Moisture:</strong>
            <em>30%</em>
        </p>

        <p>
            <strong>Recommended Irrigation Duration:</strong>
            45 Minutes
        </p>

        <p>
            <strong>Water Stress Level:</strong>
            Moderate
        </p>

        <hr>

        <small>
            <i>
                Advisory generated using AI analysis based on soil moisture,
                weather forecast, and crop condition.
            </i>
        </small>

    </div>

</body>
</html>
